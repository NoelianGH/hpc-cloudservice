# Worker relawan di dalam sandbox: non-root, read-only, tanpa capability,
# tanpa akses folder host / docker.sock, dibatasi CPU, RAM, dan jumlah proses.
# Kode dari repo job di-clone ke /tmp (tmpfs di RAM, hilang saat kontainer mati).
services:
  worker:
    build: .
    image: hpc-worker
    restart: unless-stopped
    environment:
      COORDINATOR_URL: ${COORDINATOR_URL}
      WORKER_TOKEN: ${WORKER_TOKEN}
      WORKER_NAME: ${WORKER_NAME}
      # WORKER_ID diisi otomatis oleh worker_auth_cli.py setelah autentikasi berhasil.
      # Jika kosong, worker akan membuat entri baru (mode token global / backward-compat).
      WORKER_ID: ${WORKER_ID:-}
      CHEAT: ${CHEAT:-0}
      # Kapasitas sandbox dilaporkan ke koordinator (harus sama dengan cpus/mem_limit di bawah)
      WORKER_CPUS: ${WORKER_CPUS:-1}
      WORKER_MEMORY_MB: ${WORKER_MEMORY_MB:-512}
      # Worker hanya mau clone repo job dengan awalan ini
      ALLOWED_REPO_PREFIXES: ${ALLOWED_REPO_PREFIXES:-https://github.com/}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: ${WORKER_MEMORY_MB:-512}m
    cpus: ${WORKER_CPUS:-1}
