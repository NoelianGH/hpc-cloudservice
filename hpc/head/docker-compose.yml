services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hpc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hpc
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpc"]
      interval: 3s
      retries: 20

  coordinator:
    build: ./coordinator
    restart: unless-stopped
    environment: &env
      DATABASE_URL: postgresql://hpc:${POSTGRES_PASSWORD}@db:5432/hpc
      WORKER_TOKEN: ${WORKER_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-8}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_MIN_ACCOUNT_AGE_DAYS: ${GITHUB_MIN_ACCOUNT_AGE_DAYS:-30}
      GITHUB_MIN_PUBLIC_REPOS: ${GITHUB_MIN_PUBLIC_REPOS:-2}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Repo job (kode tugas) terpisah dari repo HPC, dipatok ke commit SHA
      JOB_REPO_URL: ${JOB_REPO_URL:-}
      JOB_REPO_ENTRY: ${JOB_REPO_ENTRY:-python3 run.py}
      JOB_REPO_ALLOWLIST: ${JOB_REPO_ALLOWLIST:-https://github.com/}
      # Hasil job di-commit HANYA oleh head node ke branch per job
      RESULTS_REPO_URL: ${RESULTS_REPO_URL:-}
      RESULTS_GIT_TOKEN: ${RESULTS_GIT_TOKEN:-}
      RESULTS_BRANCH_PREFIX: ${RESULTS_BRANCH_PREFIX:-results/job-}
      # Insentif relawan
      CERT_MIN_CREDITS: ${CERT_MIN_CREDITS:-50}
      CERT_MAX_REJECT_PCT: ${CERT_MAX_REJECT_PCT:-10}
      VALIDATOR_TICK_SECONDS: ${VALIDATOR_TICK_SECONDS:-1}
      # Proyek perangkat lunak (repo B) yang dikerjakan relawan + CI terdistribusi
      PROJECT_REPO_URL: ${PROJECT_REPO_URL:-}
      PROJECT_APP_NAME: ${PROJECT_APP_NAME:-}
      PROJECT_DEFAULT_BRANCH: ${PROJECT_DEFAULT_BRANCH:-main}
      PROJECT_BRANCH_PREFIX: ${PROJECT_BRANCH_PREFIX:-task/}
      PROJECT_GIT_TOKEN: ${PROJECT_GIT_TOKEN:-}
      PROJECT_WEBHOOK_SECRET: ${PROJECT_WEBHOOK_SECRET:-}
      PROJECT_POLL_SECONDS: ${PROJECT_POLL_SECONDS:-90}
      JOBDESK_MAX_ACTIVE: ${JOBDESK_MAX_ACTIVE:-1}
      # Alamat koordinator untuk worker relawan (head-online menyimpannya otomatis; ini cadangan)
      PUBLIC_COORDINATOR_URL: ${PUBLIC_COORDINATOR_URL:-}
      # Login website relawan (email + password): umur sesi web (hari)
      WORKER_SESSION_DAYS: ${WORKER_SESSION_DAYS:-7}
      # Keamanan: rahasia web<->koordinator (IP asli pengunjung), OTP ke browser (uji lokal), /docs API
      WEB_PROXY_SECRET: ${WEB_PROXY_SECRET:-}
      DEV_SHOW_OTP: ${DEV_SHOW_OTP:-0}
      API_DOCS: ${API_DOCS:-0}
      REQUIRE_CI_PASS: ${REQUIRE_CI_PASS:-1}
      CI_REPLICAS: ${CI_REPLICAS:-2}
      CI_TIMEOUT_S: ${CI_TIMEOUT_S:-300}
      CI_MEMORY_MB: ${CI_MEMORY_MB:-512}
      # Watch + peringatan admin (tab PERINGATAN, email ke ALERT_EMAIL_TO / ADMIN_EMAIL)
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_MIN_LEVEL: ${ALERT_EMAIL_MIN_LEVEL:-warning}
      ALERT_EMAIL_COOLDOWN_MIN: ${ALERT_EMAIL_COOLDOWN_MIN:-15}
      WATCH_MISMATCH_LIMIT: ${WATCH_MISMATCH_LIMIT:-3}
      BACKUP_MAX_AGE_MIN: ${BACKUP_MAX_AGE_MIN:-130}
      # Akses relawan ke compute node per jobdesk (ssh + gerbang git, lihat node_access.py)
      NODE_ACCESS: ${NODE_ACCESS:-1}
      NODE_TOKEN: ${NODE_TOKEN:-}
      NODE_SSH_HOST: ${NODE_SSH_HOST:-localhost}
      NODE_SSH_PORT: ${NODE_SSH_PORT:-2222}
      NODE_MAX_USERS: ${NODE_MAX_USERS:-3}
      NODE_TOKEN_TTL_DAYS: ${NODE_TOKEN_TTL_DAYS:-7}
      NODE_READ_MAIN: ${NODE_READ_MAIN:-1}
      JOBDESK_AUTO_ASSIGN: ${JOBDESK_AUTO_ASSIGN:-0}
    ports:
      - "8000:8000"
    networks: [default, nodes]
    depends_on:
      db:
        condition: service_healthy

  validator:
    build: ./coordinator
    restart: unless-stopped
    command: ["python", "validator.py"]
    environment: *env
    depends_on:
      db:
        condition: service_healthy

  # Compute node untuk relawan-developer (disediakan platform). Relawan login dari command prompt:
  #   ssh -p 2222 jd<id>@<alamat-head>   (node1)      ssh -p 2223 jd<id>@<alamat-head>   (node2)
  # Akses baru ditempatkan di node paling longgar secara bergiliran, maks NODE_MAX_USERS per node.
  # Node hanya terhubung ke koordinator (jaringan 'nodes'), tidak ke database. User per jobdesk dibuat /
  # dihapus oleh agen di dalamnya; push repo B hanya lewat gerbang git koordinator.
  # Tambah node: salin blok node2 (nama, hostname, NODE_NAME, port, volume berbeda).
  node: &node
    build: ./node
    image: hpc-head-node
    restart: unless-stopped
    hostname: node1
    environment:
      COORDINATOR_URL: http://coordinator:8000
      NODE_TOKEN: ${NODE_TOKEN:-}
      NODE_NAME: node1
      NODE_MAX_USERS: ${NODE_MAX_USERS:-3}
      NODE_SSH_PUBLIC_PORT: ${NODE_SSH_PORT:-2222}
    ports:
      - "${NODE_SSH_PORT:-2222}:22"
    networks: [nodes]
    volumes:
      - nodehome:/home              # pekerjaan relawan tetap ada walau kontainer dibuat ulang
      - nodekeys:/var/lib/hpc-node  # kunci host SSH tetap sama
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL, SYS_CHROOT, AUDIT_WRITE, NET_BIND_SERVICE]
    # Program setuid (su, passwd, ...) tidak bisa menaikkan hak akses relawan
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    mem_limit: ${NODE_MEMORY:-2g}
    cpus: ${NODE_CPUS:-1}
    depends_on:
      - coordinator

  node2:
    <<: *node
    hostname: node2
    environment:
      COORDINATOR_URL: http://coordinator:8000
      NODE_TOKEN: ${NODE_TOKEN:-}
      NODE_NAME: node2
      NODE_MAX_USERS: ${NODE_MAX_USERS:-3}
      NODE_SSH_PUBLIC_PORT: ${NODE2_SSH_PORT:-2223}
    ports:
      - "${NODE2_SSH_PORT:-2223}:22"
    volumes:
      - node2home:/home
      - node2keys:/var/lib/hpc-node

  # Backup database otomatis tiap jam ke folder backup/ (lihat backup/backup.sh)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: hpc
      PGDATABASE: hpc
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${BACKUP_TZ:-WIB-7}
      BACKUP_KEEP_HOURLY: ${BACKUP_KEEP_HOURLY:-24}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_COPY_DIR: ${BACKUP_COPY_DIR:-}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ../backup:/backup
      # Salinan di luar laptop (mis. folder Google Drive/OneDrive). Kosong = tidak disalin.
      - ${BACKUP_COPY_DIR:-../backup/.tanpa-salinan}:/backup-copy
    depends_on:
      db:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://coordinator:8000
    profiles: ["online"]
    depends_on:
      - coordinator

  # SSH compute node lewat internet (relawan di jaringan lain). Relawan butuh cloudflared:
  #   ssh -o ProxyCommand="cloudflared access ssh --hostname %h" jd12@<alamat>.trycloudflare.com
  tunnel-ssh:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url ssh://node:22
    profiles: ["online"]
    networks: [nodes]
    depends_on:
      - node

  tunnel-ssh2:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url ssh://node2:22
    profiles: ["online"]
    networks: [nodes]
    depends_on:
      - node2

networks:
  default:
  nodes:

volumes:
  dbdata:
  nodehome:
  nodekeys:
  node2home:
  node2keys: