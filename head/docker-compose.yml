services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hpc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hpc
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpc"]
      interval: 3s
      retries: 20

  coordinator:
    build: ./coordinator
    restart: unless-stopped
    environment: &env
      DATABASE_URL: postgresql://hpc:${POSTGRES_PASSWORD}@db:5432/hpc
      WORKER_TOKEN: ${WORKER_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_MIN_ACCOUNT_AGE_DAYS: ${GITHUB_MIN_ACCOUNT_AGE_DAYS:-30}
      GITHUB_MIN_PUBLIC_REPOS: ${GITHUB_MIN_PUBLIC_REPOS:-2}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  validator:
    build: ./coordinator
    restart: unless-stopped
    command: ["python", "validator.py"]
    environment: *env
    depends_on:
      db:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://coordinator:8000
    profiles: ["online"]
    depends_on:
      - coordinator

volumes:
  dbdata: